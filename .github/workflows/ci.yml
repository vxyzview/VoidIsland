name: CI

# Builds and tests every push to main and every pull request. It signs and publishes nothing (that is the Build APK workflow),
# and needs no secrets, so it also runs for pull requests from forks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK pieces
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" >/dev/null

      - name: Build (a throwaway signing key; nothing is published)
        # build.sh makes its own random key when there is none, so this needs no secrets.
        run: ./build.sh ci 0.0-ci 1

      - name: String resources (same keys in every language, no typo'd Str.t keys)
        run: bash tools/check-strings.sh

      - name: Compiler warnings (listed, not fatal)
        run: |
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p out/lint
          javac -Xlint:all -Xmaxwarns 500 -d out/lint -cp "$AJ" $(find src -name '*.java') 2>&1 | grep -E "warning:" | sed 's/^.*warning: /warning: /' | sort | uniq -c | sort -rn | head -20 || true

      - name: Unit checks
        run: |
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          javac -d out/test -cp "out/classes:$AJ" $(find test -name '*.java')
          java -cp "out/test:out/classes:$AJ" com.vxyzview.voidisland.Check
