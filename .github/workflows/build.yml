name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable = regular Release; beta/alpha = pre-release'
        required: true
        default: beta
        type: choice
        options: [beta, alpha, stable]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only this job publishes the Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0   # full history: tags + commit count for versionCode

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          # Every run publishes a Release, and an APK signed with a throwaway key can never be updated over a real one
          # (users would have to uninstall first), so a missing key stops the build instead of shipping one.
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secrets SIGNING_KEYSTORE (base64 of void.jks) and SIGNING_KEYSTORE_PASSWORD are both required. If your keystore still uses the old built-in password, set SIGNING_KEYSTORE_PASSWORD to 'voidisland' for now and rotate the key later."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 -d > void.jks
          echo "Signing with the keystore from repository secrets."

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad   # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK pieces
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" >/dev/null

      - name: Work out version
        run: |
          set -e
          # Tag push (v1.2 or v1.2-beta.1 / v1.2-alpha.1): name comes from the tag.
          # Manual run: version comes from the latest tag.
          #   beta/alpha  -> latest-tag + channel + timestamp (e.g. 1.1-beta.2510310042)
          #   stable      -> next patch after the latest tag (1.1 -> 1.2, 1.2.3 -> 1.2.4)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            CHANNEL="${{ inputs.channel }}"
            LAST="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
            BASE="$(printf '%s' "${LAST:-v1.1}" | sed -e 's/^v//' -e 's/-.*$//')"
            if [ "$CHANNEL" = "stable" ] && printf '%s' "$LAST" | grep -q -- '-' && ! git rev-parse -q --verify "refs/tags/v${BASE}" >/dev/null; then
              VERSION="$BASE"   # the latest tag was a beta/alpha of this number and it was never released: release that number itself
            elif [ "$CHANNEL" = "stable" ]; then
              if printf '%s' "$BASE" | grep -q '\.'; then
                MAJMIN="${BASE%.*}"; PATCH="${BASE##*.}"
              else
                MAJMIN="$BASE"; PATCH="0"
              fi
              VERSION="${MAJMIN}.$(( PATCH + 1 ))"
            else
              VERSION="${BASE}-${CHANNEL}.$(date +%y%m%d%H%M)"
            fi
          fi
          # any suffix (alpha/beta/rc) -> pre-release
          case "$VERSION" in *-*) PRE=1 ;; *) PRE=0 ;; esac
          # versionCode: monotonic build number, +10 per commit, pre-releases 5 points below
          BUILD="$(git rev-list --count HEAD)"
          if [ "$PRE" = "1" ]; then VCODE=$(( BUILD * 10 - 5 )); else VCODE=$(( BUILD * 10 )); fi
          [ "$VCODE" -ge 1 ] || VCODE=1
          {
            echo "VERSION=$VERSION"
            echo "APK=VoidIsland-$VERSION"
            echo "VERSIONCODE=$VCODE"
            echo "PRE=$PRE"
          } >> "$GITHUB_ENV"
          echo "::notice::$( [ "$PRE" = "1" ] && echo pre-release || echo stable ) -> VoidIsland-$VERSION (versionCode $VCODE)"

      - name: Build (javac, dx, aapt, zipalign, apksigner)
        env:
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./build.sh "$APK" "$VERSION" "$VERSIONCODE"

      - name: Unit checks
        run: |
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          javac -d out/test -cp "out/classes:$AJ" $(find test -name '*.java')
          java -cp "out/test:out/classes:$AJ" com.vxyzview.voidisland.Check

      - name: Checksum
        run: (cd out && sha256sum "$APK.apk" > "$APK.apk.sha256" && cat "$APK.apk.sha256")

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "out/$APK.apk"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "$PRE" = "1" ]; then FLAGS="--prerelease"; fi
          TAG="v$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "release tag: $TAG (pre-release: $PRE)"
          gh release create "$TAG" "out/$APK.apk" "out/$APK.apk.sha256" --title "$APK" --generate-notes $FLAGS

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: ${{ env.APK }}
          path: |
            out/*.apk
            out/*.sha256
          if-no-files-found: error
