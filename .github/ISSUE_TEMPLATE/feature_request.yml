name: Feature request
description: Suggest a new style, rule, language or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the missing piece, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A sketch, a reference from another phone or a short description all help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Notifications and banners
        - Music and lyrics
        - Idle clock
        - Calls, timers and live activities
        - Rules and privacy
        - Settings and backup
        - Translation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
